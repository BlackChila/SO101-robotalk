name: Software and documentation checks

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check the documentation checker
        run: python3 -m unittest discover -s .github/scripts -p 'test_check_docs.py'
      - name: Check local documentation links and anchors
        run: python3 .github/scripts/check_docs.py
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install locked UI build dependencies
        run: npm --prefix ui ci --no-audit --no-fund
      - name: Run existing mocked UI tests
        run: node --test ui/src/*.test.js
      - name: Build the UI
        run: npm --prefix ui run build
